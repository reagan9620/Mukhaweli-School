name: Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check every source file parses
        run: |
          failed=0
          while IFS= read -r file; do
            node --check "$file" || failed=1
          done < <(git ls-files '*.js')
          exit $failed
